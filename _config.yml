title: Amol Joshi — AI Product & Solution Architecture
description: >-
  Notes by Amol Joshi, AI-first product owner and AI solution architect: how AI-enabled products are
  designed, architected, measured and shipped, with the performance work and decisions behind them.
author:
  name: Amol Joshi
  email: apnaprogrammer@gmail.com
  portfolio: https://amolmjoshi93.github.io/
baseurl: /blogs
url: https://amolmjoshi93.github.io
timezone: Asia/Kolkata
future: true
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Projects each post can belong to (front matter `project: <slug>`); one page per project.
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }

# Home page lists 10 posts per page (/page2/, /page3/, ...).
paginate: 10
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
